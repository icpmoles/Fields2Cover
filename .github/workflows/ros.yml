---
name: Build for Ros2
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  noble_rolling:
    runs-on: ubuntu-24.04
    env:
      ROS_DISTRO: ${{ matrix.ros_distro }}
    container:
      image: rostooling/setup-ros-docker:uubuntu-resolute-ros-rolling-desktop-latest
    strategy:
      fail-fast: false
      matrix:
        ros_distro: [rolling, jazzy, kilted]
    steps:
      - name: checkout source
        uses: actions/checkout@v4
      - name: Build and run tests
        id: action-ros-ci
        uses: ros-tooling/action-ros-ci@3a640b10f09b756dabe556dac5413aba369f71b0 # v0.48
        with:
          package-name: "fields2cover"
          target-ros2-distro: ${{ matrix.ros_distro }}
          vcs-repo-file-url: "${{ github.workspace }}/.github/deps.repos"
          colcon-defaults: |
            {
              "test": {
                "packages-select": [
                    "fields2cover"
                ]
              }
            }
